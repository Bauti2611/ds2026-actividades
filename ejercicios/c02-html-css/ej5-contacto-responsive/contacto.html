<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi CV - Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Currículum</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="estudios.html">Estudios</a>
            <a href="experiencia.html">Experiencia</a>
            <a href="hobbies.html">Hobbies</a>
            <a href="contacto.html">Contacto</a> 
        </nav>
    </header>
    <main>
        <section>
            <h2>Contactame</h2>
            <form class="formulario">
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Bautista Biscayart">
                </div>
                
                <div class="campo">
                    <label for="email">Correo electronico:</label>
                    <input type="email" id="email" name="email" required placeholder="biscayartbautista@gmail.com">
                </div>
                
                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribí tu mensaje aca..."></textarea>
                </div>
                
                <button type="submit">Enviar Mensaje</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Desarrollo de Software</p>
    </footer>
</body>
</html>
